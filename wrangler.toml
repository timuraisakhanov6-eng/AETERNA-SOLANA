# ─────────────────────────────────────────────
# Executor Hot (Publication Authority)
#
# Endpoint: /api/upload
# Module:   functions/lib/executorHot.ts
#
# Executor Hot performs publication to Irys on behalf
# of the protocol. The client never receives or supplies
# any publication credentials.
#
# All sensitive values MUST be configured using
# Wrangler Secrets and MUST NEVER be committed
# to Git or placed inside wrangler.toml.
#
# Required production secrets:
#
# EXECUTOR_PRIVATE_KEY
#   Operational signing key for publication execution.
#
# Note: payment verification secrets are defined separately.
#
# Current implementation notes:
#
# Executor Hot currently uses the canonical
# Irys Mainnet endpoint compiled into
# executorHot.ts:
#
#   https://node1.irys.xyz
#
# Publication currently uses the Irys Mainnet endpoint compiled into
# executorHot.ts:
#
#   https://node1.irys.xyz
#
# These values are implementation constants,
# not deployment secrets.
#
# NEVER place secret values in this file.
#
# Configure every secret with:
#
#   wrangler secret put <SECRET_NAME>
#
# Example:
#
#   wrangler secret put EXECUTOR_PRIVATE_KEY
#
# Secrets are stored securely by Cloudflare and
# are never committed to the repository.
# ─────────────────────────────────────────────
