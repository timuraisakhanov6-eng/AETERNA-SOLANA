<!-- ===== EMERGENCY WATCHDOG (Spec §25) ===== -->

<script>
(function () {

  if (!window.location.pathname.startsWith("/capsule/"))
    return;

  var TIMEOUT_MS = 8000;

  var timer = setTimeout(function () {

    var hash =
      window.location.hash;

    /**
     * Fragment presence guard.
     *
     * Watchdog transports capability fragments
     * transparently but MUST NOT redirect
     * empty or missing fragments.
     */

    if (
      typeof hash !== "string" ||
      hash.length < 2
    ) {
      return;
    }

    var capsuleId =
      window.location.pathname
        .split("/capsule/")[1] || "";

    /* strict capsuleId validation */

    if (!/^[a-f0-9]{64}$/.test(capsuleId))
      return;

    window.location.replace(
      "/emergency.html?capsuleId=" +
      encodeURIComponent(capsuleId) +
      hash
    );

  }, TIMEOUT_MS);

  window.addEventListener(
    "aeterna:ready",
    function () {
      clearTimeout(timer);
    }
  );

})();
</script>
